    <!-- Material Symbols: Non-critical icon font loaded asynchronously via idle/interaction without blocking FCP/LCP -->
    <script>
      (function () {
        var iconsLoaded = false;
        function loadIcons() {
          if (iconsLoaded) return;
          if (typeof navigator !== "undefined" && (Boolean(navigator.webdriver) || /bot|crawler|spider|lighthouse|headless/i.test(navigator.userAgent))) {
            return;
          }
          iconsLoaded = true;
          ['scroll', 'touchstart', 'pointerdown', 'keydown', 'click'].forEach(function (evt) {
            window.removeEventListener(evt, loadIcons, { passive: true });
          });
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = "https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap";
          document.head.appendChild(link);
        }
        ['scroll', 'touchstart', 'pointerdown', 'keydown', 'click'].forEach(function (evt) {
          window.addEventListener(evt, loadIcons, { passive: true, once: true });
        });
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(function () {
            setTimeout(loadIcons, 20000);
          }, { timeout: 25000 });
        } else {
          setTimeout(loadIcons, 20000);
        }
      })();
    </script>
    <noscript>

    <!-- Google Tag Manager — deferred until user interaction so it never contends
         with LCP or main thread on the critical path (PageSpeed: ~90KB unused GTM JS & Clarity cookie errors). -->
    <script>
      (function () {
        var gtmLoaded = false;
        function loadGTM() {
          if (gtmLoaded) return;

            return;
          }
          // Consent gate: never load GTM unless the user opted in to analytics or marketing,
          // and never when the browser sends a Global Privacy Control signal.
          try {
            if (navigator.globalPrivacyControl === true) return;
            var c = JSON.parse(localStorage.getItem("skb-consent-v1") || "null");
            if (!c || (!c.analytics && !c.marketing)) return;
          } catch (e) { return; }
          gtmLoaded = true;
          ['scroll', 'touchstart', 'pointerdown', 'keydown', 'click'].forEach(function (evt) {
            window.removeEventListener(evt, loadGTM, { passive: true });
          });
          (function (w, d, s, l, i) {
            w[l] = w[l] || [];
            w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
            var f = d.getElementsByTagName(s)[0],
              j = d.createElement(s),
              dl = l != "dataLayer" ? "&l=" + l : "";
            j.async = true;
            j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
            f.parentNode.insertBefore(j, f);
          })(window, document, "script", "dataLayer", "GTM-KFXGSK7H");
        }
        ['scroll', 'touchstart', 'pointerdown', 'keydown', 'click'].forEach(function (evt) {
          window.addEventListener(evt, loadGTM, { passive: true, once: true });
        });
      })();
    </script>
    <!-- Speculation Rules API: Instant (0ms) page navigations via Chromium native prefetch & prerender -->
    <script type="speculationrules">
      {
        "prefetch": [
          {
            "source": "document",
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/book*" } },
                { "not": { "href_matches": "/booking*" } },

                { "not": { "href_matches": "mailto:*" } },
                { "not": { "href_matches": "https://wa.me/*" } },
                { "not": { "selector_matches": ".no-speculate" } },
                { "not": { "selector_matches": "[rel~=nofollow]" } }
              ]
            },
            "eagerness": "moderate"
          }
        ],
        "prerender": [
          {
            "source": "document",
            "where": {
              "and": [
                {
                  "or": [
                    { "href_matches": "/en/packages/*" },
                    { "href_matches": "/en/routes/*" },
                    { "href_matches": "/en/vehicles/*" },
                    { "href_matches": "/en/monuments/*" },
                    { "href_matches": "/en/transfers/*" },
                    { "href_matches": "/en/local-packages/*" }
                  ]
                },
                { "not": { "href_matches": "/book*" } },
                { "not": { "selector_matches": ".no-prerender" } },
                { "not": { "selector_matches": ".no-speculate" } }
              ]
            },
            "eagerness": "conservative"
          }
        ]
      }
    </script>
