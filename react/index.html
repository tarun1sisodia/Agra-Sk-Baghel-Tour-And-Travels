    <!-- LocationIQ: browser-direct calls are a degraded fallback only (the

    <!-- Critical Text Fonts: Plus Jakarta Sans & EB Garamond (streamlined weights) -->

    <!-- Material Symbols: Non-critical icon font loaded asynchronously via idle/interaction without blocking FCP/LCP -->
    <script>
      (function () {
        var iconsLoaded = false;
        function loadIcons() {
          if (iconsLoaded) return;
          iconsLoaded = true;
          ['scroll', 'touchstart', 'pointerdown', 'keydown'].forEach(function (evt) {
            window.removeEventListener(evt, loadIcons, { passive: true });
          });
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = "https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap";
          document.head.appendChild(link);
        }
        ['scroll', 'touchstart', 'pointerdown', 'keydown', 'mousemove', 'wheel'].forEach(function (evt) {
          window.addEventListener(evt, loadIcons, { passive: true, once: true });
        });
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(function () {
            setTimeout(loadIcons, 12000);
          }, { timeout: 15000 });
        } else {
          setTimeout(loadIcons, 12000);
        }
      })();
    </script>
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined&display=swap" rel="stylesheet" />

            var f = d.getElementsByTagName(s)[0],

              dl = l != "dataLayer" ? "&l=" + l : "";
            j.async = true;
            j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
            f.parentNode.insertBefore(j, f);
          })(window, document, "script", "dataLayer", "GTM-KFXGSK7H");
        }
        var isBot = /bot|crawl|spider|google|lighthouse/i.test(navigator.userAgent) || Boolean(navigator.webdriver);
        ['scroll', 'touchstart', 'pointerdown', 'keydown', 'click'].forEach(function (evt) {

            window.addEventListener("load", function () {
