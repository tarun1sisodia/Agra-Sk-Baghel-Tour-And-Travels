<!-- LCP hero image (first slide): preload so mobile LCP is not delayed by JS discovery -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/assets/home-hero/taj-mahal-agra-1600.avif"
      imagesrcset="/assets/home-hero/taj-mahal-agra-480.avif 480w, /assets/home-hero/taj-mahal-agra-960.avif 960w, /assets/home-hero/taj-mahal-agra-1280.avif 1280w, /assets/home-hero/taj-mahal-agra-1600.avif 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
<title>Taxi Service in Agra | Cabs & Car Rental | SK Baghel</title>
    <!-- Google Tag Manager: Deferred and consent-gated in bundled client code (headScripts.ts) -->
    <!-- Speculation Rules API: Instant (0ms) page navigations via Chromium native prefetch & prerender -->
    <script type="speculationrules">
      {
        "prefetch": [
          {
            "source": "document",
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/book*" } },
                { "not": { "href_matches": "/booking*" } },
                { "not": { "href_matches": "/auth*" } },
                { "not": { "href_matches": "/login*" } },
                { "not": { "href_matches": "/my-bookings*" } },
                { "not": { "href_matches": "/payment*" } },
                { "not": { "href_matches": "/review*" } },
                { "not": { "href_matches": "*/admin*" } },
                { "not": { "href_matches": "tel:*" } },
                { "not": { "href_matches": "mailto:*" } },
                { "not": { "href_matches": "https://wa.me/*" } },
                { "not": { "selector_matches": ".no-speculate" } },
                { "not": { "selector_matches": "[rel~=nofollow]" } }
              ]
            },
            "eagerness": "moderate"
          }
        ],
        "prerender": [
          {
            "source": "document",
            "where": {
              "and": [
                {
                  "or": [
                    { "href_matches": "/en/packages/*" },
                    { "href_matches": "/en/routes/*" },
                    { "href_matches": "/en/vehicles/*" },
                    { "href_matches": "/en/monuments/*" },
                    { "href_matches": "/en/transfers/*" },
                    { "href_matches": "/en/local-packages/*" }
                  ]
                },
                { "not": { "href_matches": "/book*" } },
                { "not": { "selector_matches": ".no-prerender" } },
                { "not": { "selector_matches": ".no-speculate" } }
              ]
            },
            "eagerness": "conservative"
          }
        ]
      }
    </script>
    <!-- End Google Tag Manager -->
  </head>
