# Cloudflare Pages project: skbagheltravels-admin
# Set the Pages root directory to `admin` in the dashboard, then use:
# Build command: npm ci && npm run build
# Build output directory: dist
# API calls should target https://api.agraskbagheltourandtravels.com via VITE_API_BASE_URL.

[build]
command = "npm ci && npm run build"
output_dir = "dist"

[vars]
NODE_VERSION = "22"
VITE_BASE_PATH = "/"
# Set VITE_API_BASE_URL in the CF Pages dashboard (Production + Preview).
# Do NOT commit real values here — this file is public.
# VITE_API_BASE_URL = "https://api.agraskbagheltourandtravels.com"
