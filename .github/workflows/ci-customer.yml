name: "Customer Site — Quality & Deploy Guard"

on:
  push:
    branches:
      - main
      - "arena/**"
      - "design/**"
      - "feat/**"
      - "fix/**"
    paths:
      - "react/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - "react/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  quality-gate:
    name: "TypeCheck · Build · Prerender · Asset Guard"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: react

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: react/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Vite Production Build + Prerender
        run: npm run build
        env:
          VITE_BASE_PATH: "/"
          VITE_SITE_URL: https://agraskbagheltourandtravels.com
          # This stage-named Render service is the current live API for this account; its database remains test-only.
          VITE_API_BASE_URL: https://skb-baghel-api-staging.onrender.com
          VITE_SITE_MODE: production
          VITE_HINDI_INDEXING_ENABLED: "false"
          RELEASE_BUILD: "1"
          # Prerender runs with --experimental-strip-types; no secrets needed at build time.

      - name: Verify dist/ was produced
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::dist/ is missing or empty after build"
            exit 1
          fi
          echo "dist/ contents:"
          ls -lh dist/

      - name: Verify Cloudflare Asset Size Budgets (<25 MiB per file)
        run: |
          echo "Scanning dist/ for files exceeding Cloudflare 25 MiB single-file limit..."
          find dist -type f -size +25M | tee ../oversized_assets.txt
          if [ -s ../oversized_assets.txt ]; then
            echo "::error::Found assets exceeding Cloudflare 25 MiB threshold!"
            cat ../oversized_assets.txt
            exit 1
          else
            echo "All dist/ assets within Cloudflare 25 MiB limits."
          fi

      - name: Secret Leak Guard — no backend secrets in frontend bundle
        run: |
          secrets="DATABASE_URL RAZORPAY_KEY_SECRET SUPABASE_SERVICE_ROLE_KEY RESEND_API_KEY SUPABASE_JWT_SECRET MONGODB_URI CARD_PROVIDER_SECRET"
          found=0
          for secret in $secrets; do
            if grep -rl "$secret" dist/ --include="*.js" --include="*.html" --include="*.css" 2>/dev/null | grep -q .; then
              echo "::error::Secret name '$secret' found in customer dist/ bundle!"
              found=1
            fi
          done
          if [ $found -eq 1 ]; then exit 1; fi
          echo "No secret names leaked into customer bundle."

      - name: Publish Build Summary to GitHub Step Summary
        if: always()
        run: |
          echo "## Customer Site Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d dist ]; then
            echo "### dist/ output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            du -sh dist/ && find dist -type f | sort >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ dist/ not found — build likely failed." >> $GITHUB_STEP_SUMMARY
          fi
