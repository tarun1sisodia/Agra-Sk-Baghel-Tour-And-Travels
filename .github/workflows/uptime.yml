name: Staging API keepalive and uptime

on:
  workflow_dispatch:
  schedule:
    # Keep inbound traffic under Render Free's 15-minute idle window; Actions schedules are best-effort.
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  healthcheck:
    name: "Staging API + site healthcheck"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check deployed services
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run uptime check
        run: node scripts/healthcheck.mjs
        env:
          HEALTHCHECK_URLS: "https://skb-baghel-api-staging.onrender.com/health,https://agraskbagheltourandtravels.com/,https://skbagheltravels-admin.coccoder999.workers.dev/"
          HEALTHCHECK_TIMEOUT_MS: 45000
          HEALTHCHECK_ATTEMPTS: 2

      - name: Publish Healthcheck Summary
        if: always()
        run: |
          echo "## Staging API keepalive and service health: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Checked endpoints: Render staging API, customer site, and admin desk." >> $GITHUB_STEP_SUMMARY
