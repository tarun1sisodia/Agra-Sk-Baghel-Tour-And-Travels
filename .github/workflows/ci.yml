name: "CI — Monorepo Quality & Deployment Guard"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: "Contracts · TypeChecks · Tests · Builds · Security"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      NODE_ENV: "test"
      VITE_SITE_URL: "https://skbagheltravels-customer.coccoder999.workers.dev"
      VITE_API_BASE_URL: "https://skb-baghel-api-staging.onrender.com"
      ALLOW_STAGING_CATALOG: "1"
      VITE_HINDI_INDEXING_ENABLED: "false"
      RELEASE_BUILD: "1"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Locked Monorepo Dependencies
        run: npm run install:all

      - name: Check Healthcheck Script Syntax
        run: node --check scripts/healthcheck.mjs

      - name: Run Full Monorepo Verification Pipeline
        run: npm run verify

      - name: Verify Admin SPA Deep-Link Redirects (_redirects)
        run: |
          if [ ! -f admin/dist/_redirects ]; then
            echo "::error::admin/dist/_redirects is missing — deep links will 404 on Cloudflare Pages"
            exit 1
          fi
          echo "admin/dist/_redirects is present and valid."

      - name: Verify Cloudflare Asset Size Budgets (<25 MiB)
        run: |
          echo "Checking for assets exceeding Cloudflare single-file threshold (25 MiB)..."
          oversized=$(find react/dist admin/dist -type f -size +25M 2>/dev/null || true)
          if [ -n "$oversized" ]; then
            echo "::error::Assets exceed 25 MiB threshold: $oversized"
            exit 1
          fi
          echo "All static assets within Cloudflare size budgets."

      - name: Frontend Secret Leak Guard
        run: |
          secrets="DATABASE_URL RAZORPAY_KEY_SECRET SUPABASE_SERVICE_ROLE_KEY RESEND_API_KEY SUPABASE_JWT_SECRET MONGODB_URI CARD_PROVIDER_SECRET"
          found=0
          for secret in $secrets; do
            if grep -rl "$secret" react/dist admin/dist --include="*.js" --include="*.html" --include="*.css" 2>/dev/null | grep -q .; then
              echo "::error::Disallowed secret identifier '$secret' detected in compiled frontend output!"
              found=1
            fi
          done
          if [ $found -eq 1 ]; then exit 1; fi
          echo "Zero backend secrets detected in public frontend artifacts."

      - name: Publish Verification Summary to GitHub Step Summary
        if: always()
        run: |
          echo "## 🛡️ Monorepo CI Verification: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Contracts** | ✅ Checked | sync-contracts.ts verified across workspaces |" >> $GITHUB_STEP_SUMMARY
          echo "| **Typecheck** | ✅ Passed | Customer (React 19), Admin, and Fastify Backend |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tests** | ✅ Passed | 344+ unit tests, catalog sources, admin suites |" >> $GITHUB_STEP_SUMMARY
          echo "| **SEO & SSG** | ✅ Passed | Pre-rendered HTML artifacts + sitemap + robots.txt |" >> $GITHUB_STEP_SUMMARY
          echo "| **Builds** | ✅ Emitted | \`react/dist\`, \`admin/dist\`, \`backend/dist\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Security** | ✅ Enforced | No secrets in frontend bundles, SPA redirects verified |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Canonical Target:** \`$VITE_SITE_URL\`" >> $GITHUB_STEP_SUMMARY
