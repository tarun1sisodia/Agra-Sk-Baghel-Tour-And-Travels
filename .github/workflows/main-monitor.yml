name: Main branch implementation monitor

on:
  push:
    branches:
      - main
    paths-ignore:
      - "monitor-reports/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-branch-monitor
  cancel-in-progress: false

jobs:
  verify-and-report:
    name: Verify main and commit report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SITE_URL: https://agraskbagheltourandtravels.com
      VITE_SITE_MODE: production
      VITE_HINDI_INDEXING_ENABLED: "false"
      RELEASE_BUILD: "1"
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm run install:all

      - name: Run full verification
        id: verify
        shell: bash
        run: |
          set +e
          npm run verify 2>&1 | tee /tmp/arenaai-verify.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write Markdown report
        if: always()
        shell: bash
        env:
          VERIFY_STATUS: ${{ steps.verify.outputs.status }}
        run: |
          set -e
          sha="${GITHUB_SHA}"
          short_sha="${sha:0:12}"
          date_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          report_date="$(date -u +%Y-%m-%d)"
          mkdir -p monitor-reports
          if [ "${VERIFY_STATUS:-1}" = "0" ]; then
            result="PASS"
          else
            result="FAIL"
          fi
          {
            echo "# Main branch verification — ${short_sha}"
            echo
            echo "- **Result:** ${result}"
            echo "- **Commit:** [${sha}](https://github.com/${GITHUB_REPOSITORY}/commit/${sha})"
            echo "- **Checked at:** ${date_utc}"
            echo "- **Workflow run:** [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "## Changed files"
            echo
            git diff-tree --no-commit-id --name-status -r "${sha}" | sed 's/^/- /' || true
            echo
            echo "## Verification command"
            echo
            echo '```text'
            echo "npm run install:all && npm run verify"
            echo '```'
            echo
            echo "## Verification result"
            echo
            echo '```text'
            tail -n 180 /tmp/arenaai-verify.log || true
            echo '```'
          } > "monitor-reports/main-${report_date}-${short_sha}.md"
          cp "monitor-reports/main-${report_date}-${short_sha}.md" monitor-reports/latest.md

      - name: Commit report to main
        if: always()
        shell: bash
        env:
          VERIFY_STATUS: ${{ steps.verify.outputs.status }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            result="FAIL"
            if [ "${VERIFY_STATUS:-1}" = "0" ]; then result="PASS"; fi
            git commit -m "chore(monitor): ${result} main verification for ${GITHUB_SHA::12}"
            git push origin HEAD:main
          fi

      - name: Fail the workflow when verification failed
        if: steps.verify.outputs.status != '0'
        run: exit 1
